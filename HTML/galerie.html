<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderne Projektgalerie</title>
    <link rel="stylesheet" href="/CSS/galerie.css">
</head>
<body>

    <!-- NEU: Header mit Logo und Hamburger-Button -->
    <header>
        <div class="logo">
            <span>DI. PETYA STANEVA</span>
            <small>EST - 2019</small>
        </div>
        <button id="menu-toggle" aria-label="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- NEU: Navigations-Overlay (zuerst versteckt) -->
    <div class="nav-overlay">
        <nav>
            <ul>
                <!-- HIER DEINE LINKS ANPASSEN -->
                <li><a href="/HTML/home.html">HOME</a></li>
                <li><a href="#">PROJEKTE</a></li>
                <li><a href="#">ÜBER UNS</a></li>
                <li><a href="#">KONTAKT</a></li>
            </ul>
        </nav>
    </div>

    <!-- Bestehende Galerie -->
    <main class="gallery-container">
        <!-- Hintergrundbilder -->
        <div class="background-images">
            <div class="background-image active" style="background-image: url('/IMAGES/bg1.webp');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/bg2.webp');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/bg3.webp');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/bg4.webp');"></div>
        </div>

        <!-- Vordergrund-Slider -->
        <div class="foreground-slider">
            <div class="slider-wrapper">
                <div class="slide">
                    <img src="/IMAGES/fg1.webp" alt="Shizuka Gardens">
                    <div class="slide-content">
                        <h2>Schöne Treppen</h2>
                        <p>Welt, </p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/fg2.webp" alt="Kawa Lofts">
                    <div class="slide-content">
                        <h2>EuroVea</h2>
                        <p>Bratislava, Slowakei</p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/fg3.webp" alt="Kinsei Pavilion">
                    <div class="slide-content">
                        <h2>St. Elizabeth</h2>
                        <p>Bratislava, Slowakei</p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/fg4.webp" alt="Yama House">
                    <div class="slide-content">
                        <h2>Arc de Triomphe de l’Étoile</h2>
                        <p>Paris, Frankreich</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigationselemente -->
        <div class="gallery-nav">
            <button id="prev-btn">PREV</button>
            <div class="nav-center">
                <span id="counter">1 / 4</span>
                <div class="progress-indicator"></div>
            </div>
            <button id="next-btn">NEXT</button>
        </div>
    </main>

    <script src="/JS/galerie.js"></script>
</body>
</html>
