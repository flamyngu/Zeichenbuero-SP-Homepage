<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderne Projektgalerie</title>
    <link rel="stylesheet" href="/CSS/galerie.css">
</head>
<body>

    <!-- NEU: Header mit Logo und Hamburger-Button -->
    <header>
        <div class="logo">
            <span>DI. PETYA STANEVA</span>
            <small>EST - 2019</small>
        </div>
        <button id="menu-toggle" aria-label="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- NEU: Navigations-Overlay (zuerst versteckt) -->
    <div class="nav-overlay">
        <nav>
            <ul>
                <!-- HIER DEINE LINKS ANPASSEN -->
                <li><a href="/HTML/home.html">HOME</a></li>
                <li><a href="#">PROJEKTE</a></li>
                <li><a href="#">ÜBER UNS</a></li>
                <li><a href="#">KONTAKT</a></li>
            </ul>
        </nav>
    </div>

    <!-- Bestehende Galerie -->
    <main class="gallery-container">
        <!-- Hintergrundbilder -->
        <div class="background-images">
            <div class="background-image active" style="background-image: url('/IMAGES/ldz_nord.jpeg');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/EuroVeaBG.jpg');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/Gemeinnützige\ Wohnungs-\ und\ Siedlungsgenossenschaft\ Familie\ 4021\ Linz\ Hasnerstraße\ 31\ foto1.jpg');"></div>
            <div class="background-image" style="background-image: url('/IMAGES/Wimhölzl\ Hinterland\ Frankenviertel\,\ 4020\ Linz\ foto1.jpg');"></div>
            
        </div>

        <!-- Vordergrund-Slider -->
        <div class="foreground-slider">
            <div class="slider-wrapper">
                <div class="slide">
                    <img src="/IMAGES/ldzForground.jpg"alt="Shizuka Gardens">
                    <div class="slide-content">
                        <h2>Landesdienstzentrale Salzburg</h2>
                        <p>Salzburg, Österreich </p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/EuroVeaFG.jpg" alt="Yama House">
                    <div class="slide-content">
                        <h2>Eurovea</h2>
                        <p>Bratislava, Slovakia</p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/Gemeinnützige.jpg" alt="Kawa Lofts">
                    <div class="slide-content">
                        <h2>Gemeinnützige Wohnungs- und Siedlungsgenossenschaft "Familie" </h2>
                        <p>Linz, Österreich</p>
                    </div>
                </div>
                <div class="slide">
                    <img src="/IMAGES/Wimhölzl Hinterland1.jpg" alt="Kinsei Pavilion">
                    <div class="slide-content">
                        <h2>Wimhölzl-Hinterland</h2>
                        <p>Linz, Österreich</p>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Navigationselemente -->
        <div class="gallery-nav">
            <button id="prev-btn">PREV</button>
            <div class="nav-center">
                <span id="counter">1 / 4</span>
                <div class="progress-indicator"></div>
            </div>
            <button id="next-btn">NEXT</button>
        </div>
    </main>

    <script src="/JS/galerie.js"></script>
</body>
</html>
