<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currently Under Development</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .icon {
      font-size: 80px;
      animation: pulse 1.5s infinite;
    }

    h1 {
      font-size: 2.5rem;
      margin: 20px 0 10px;
    }

    p {
      font-size: 1.2rem;
      color: #cccccc;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="icon">🚧</div>
  <h1>Currently Under Development</h1>
  <p>We're working hard to bring you something awesome. Please check back soon!</p>
</body>
</html>
